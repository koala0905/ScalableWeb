# 1. 既然有固定 IP，建議關閉名稱解析以提高極限穩定性
sentinel resolve-hostnames no
sentinel announce-hostnames no

# 哨兵監控的埠號
port 26379
protected-mode no
bind 0.0.0.0

# 2. 直接監控 IP 地址 (取代 redis-master)
# 假設你的 redis-master 固定 IP 是 10.2.1.10
sentinel monitor myRedis 10.2.1.10 6379 2

# 判定下線的時間 (毫秒) - 5秒是合理的業界共識
sentinel down-after-milliseconds myRedis 5000

# 故障轉移超時時間
sentinel failover-timeout myRedis 10000

# 發生故障轉移時，最多可以有多少個從庫同時對新主庫進行同步
sentinel parallel-syncs myRedis 1
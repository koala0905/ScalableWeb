# 1. 初始同步對象 (服務名稱:埠號)
# 啟動後，Sentinel 會自動管理這個指令的存廢
replicaof redis-master 6379

# 2. 讓這個節點監聽所有網路介面
bind 0.0.0.0

# 3. 關閉保護模式，確保其他容器連得進來
protected-mode no

# 4. 宣告自己的實體身分 (這對 Sentinel 正確識別非常重要)
# 這裡填寫 docker-compose 裡的 service name
replica-announce-ip 10.2.1.11
replica-announce-port 6379

# 讓 Slave 只能讀取，不能寫入（符合專業架構）
replica-read-only yes

# 當 Master 斷開後，Slave 是否要繼續提供舊資料？
# yes: 雖然資料不一定最新，但服務不中斷
replica-serve-stale-data yes

# 決定 Failover 時，被提拔為 Master 的優先級 (0~100)
# 數字越小優先權越高，0 代表永遠不當 Master
replica-priority 100